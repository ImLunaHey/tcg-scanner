[workspace]
resolver = "3"
members = ["crates/scanner-types", "crates/scanner-store", "crates/scanner-ui", "crates/scanner-images"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
repository = "https://github.com/ImLunaHey/tcg-scanner"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
thiserror = "2"
rusqlite = { version = "0.41.1", features = ["bundled"] }
tempfile = "3"
libc = "0.2"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "webp"] }
imageproc = { version = "0.27", default-features = false }
moxcms = "0.8"
sha2 = "0.10"
scanner-images = { path = "crates/scanner-images", version = "0.1.0" }
rune = { git = "https://github.com/anomalyco/rune", rev = "e970367bd7d2a51e2e7d58e2978ea32eac7780cb", default-features = false, features = ["accessibility", "dbus", "embedded-fonts", "metal-backend", "native-file-dialog"] }
scanner-store = { path = "crates/scanner-store", version = "0.1.0" }
scanner-types = { path = "crates/scanner-types", version = "0.1.0" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
await_holding_lock = "deny"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
