name: Rust portability

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.98.0
          components: clippy,rustfmt
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libx11-dev libwayland-dev libudev-dev
      - name: Build Unix device fixtures
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          extension=so
          flags=(-shared -fPIC)
          if [[ "$RUNNER_OS" == macOS ]]; then
            extension=dylib
            flags=(-dynamiclib)
          fi
          for backend in sane twain; do
            library="$RUNNER_TEMP/scanner-$backend-fixture.$extension"
            cc -std=c11 -D_POSIX_C_SOURCE=200809L "${flags[@]}" -pthread "Tools/NativeDeviceTests/$backend.c" -o "$library"
            printf 'SCANNER_%s_TEST_LIBRARY=%s\n' "$(echo "$backend" | tr '[:lower:]' '[:upper:]')" "$library" >> "$GITHUB_ENV"
          done
      - name: Build Windows TWAIN fixture
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          & "$installation\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          $library = "$env:RUNNER_TEMP\scanner-twain-fixture.dll"
          cl /nologo /LD /std:c11 Tools/NativeDeviceTests/twain.c "/Fo$env:RUNNER_TEMP\twain.obj" /link "/OUT:$library"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "SCANNER_TWAIN_TEST_LIBRARY=$library" >> $env:GITHUB_ENV
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --workspace --bins --release --locked
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-${{ runner.os }}
          path: |
            target/release/scanner
            target/release/scanner.exe
            target/release/scanner-service
            target/release/scanner-service.exe
            target/release/scanner-ui
            target/release/scanner-ui.exe
            target/release/scanner-mcp
            target/release/scanner-mcp.exe
            target/release/scanner-index
            target/release/scanner-index.exe
            target/release/scanner-setup
            target/release/scanner-setup.exe
          if-no-files-found: error

  browser:
    name: Browser WebAssembly
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.98.0
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-web-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-web-
      - run: cargo clippy -p scanner-ui -p scanner-worker --lib --target wasm32-unknown-unknown --locked -- -D warnings
      - run: cargo build -p scanner-ui -p scanner-worker --lib --release --target wasm32-unknown-unknown --locked
      - run: cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - run: wasm-bindgen --target web --no-typescript --out-dir target/rune-web target/wasm32-unknown-unknown/release/scanner_ui.wasm
      - run: wasm-bindgen --target web --no-typescript --out-dir target/rune-web target/wasm32-unknown-unknown/release/scanner_worker.wasm
      - run: cargo run -p scanner-http --example web_bundle --locked -- target/rune-web
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: rune-web
          path: target/rune-web
          if-no-files-found: error

  web:
    name: Original web interface
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.98.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Web/package-lock.json
      - name: Build and test the original web interface
        working-directory: Web
        run: |
          npm ci --ignore-scripts
          npm test
          npm run build
          npx playwright install --with-deps chromium webkit
      - run: cargo run -p scanner-http --example web_bundle --locked -- Web/dist --existing
      - name: Verify the web interface against an isolated Rust service
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p scanner-http --example web_fixture --locked
          python3 -c 'from pathlib import Path; d=Path("/tmp/scanner-web-fixture"); d.mkdir(mode=0o700); p=d/"token"; p.write_text("e"*64); p.chmod(0o600)'
          target/debug/examples/web_fixture Web/dist /tmp/scanner-web-fixture/token 127.0.0.2:8172 > /tmp/scanner-web-fixture.log 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid"' EXIT
          for attempt in {1..30}; do
            if curl --noproxy '*' --fail --silent http://127.0.0.2:8172/ > /dev/null; then break; fi
            sleep 1
          done
          cd Web
          SCANNER_BROWSER_URL=http://127.0.0.2:8172 npx playwright test
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: scanner-web
          path: Web/dist
          if-no-files-found: error

  distribution:
    name: Distribution (${{ matrix.os }})
    needs: [native, web]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: native-${{ runner.os }}
          path: native
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: scanner-web
          path: web
      - name: Assemble verified distribution
        shell: bash
        run: |
          set -euo pipefail
          suffix=""
          if [[ "$RUNNER_OS" == Windows ]]; then
            suffix=".exe"
          else
            chmod +x native/scanner-setup
          fi
          "./native/scanner-setup$suffix" package --binaries native --web web --output scanner-distribution
          tar -czf "scanner-$RUNNER_OS-$RUNNER_ARCH.tar.gz" -C scanner-distribution .
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: scanner-${{ runner.os }}-${{ runner.arch }}
          path: scanner-*.tar.gz
          if-no-files-found: error
