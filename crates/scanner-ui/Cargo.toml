[package]
name = "scanner-ui"
description = "Rune desktop and web interface for Scanner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
scanner-export.workspace = true
url.workspace = true
rune.workspace = true
scanner-types.workspace = true
serde_json.workspace = true

scanner-client.workspace = true
serde.workspace = true
uuid.workspace = true
base64.workspace = true
sha2.workspace = true
futures-channel = "0.3"
futures-util = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rune = { workspace = true, features = ["accessibility", "dbus", "metal-backend", "native-file-dialog"] }
scanner-images.workspace = true
scanner-files.workspace = true
scanner-platform.workspace = true
tokio.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
rune = { workspace = true, features = ["webgl"] }
# Rune's GPU instance cache requires Send/Sync. Browser UI is single-threaded;
# wgpu only enables these implementations when wasm atomics are disabled.
wgpu = { version = "~30.0.1", default-features = false, features = ["fragile-send-sync-non-atomic-wasm"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
gloo-timers = { version = "0.3", features = ["futures"] }
web-sys = { version = "0.3", features = ["Window", "Location", "Document", "Element", "HtmlAnchorElement", "Blob", "BlobPropertyBag", "Url"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile.workspace = true
image.workspace = true

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "6", default-features = false, features = ["tokio", "proxy"] }
